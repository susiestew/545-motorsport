<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="545 Motorsport: an engineer-led racing team, climbing from club racing to GT endurance racing.">
  <title>Contact | 545 Motorsport</title>
  <link rel="icon" href="logo/favicon.png?v=2" type="image/png">
  <link rel="apple-touch-icon" href="logo/apple-touch-icon.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=1794833115">
</head>
<body>
<header class="top">
  <nav class="nav">
    <a href="index.html" class="nav-logo" aria-label="545 Motorsport home"><img src="logo/545-navy-loop.gif?v=5" alt="545" width="960" height="300"></a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links" aria-label="Menu"><span></span><span></span><span></span></button>
    <div class="nav-links" id="nav-links">
      <a href="index.html">Home</a>
      <a href="journey.html">Racing</a>
      <a href="engineering.html">Engineering</a>
      <a href="prints.html">Prints</a>
      <a href="sponsorship.html">Sponsorship</a>
    </div>
  </nav>
</header>
<main>
  <section class="hero short" style="background-image:url('img/driver-style.jpg')">
    <div class="hero-inner">
      <p class="kicker">Contact</p>
      <h1 class="display">Talk to the team</h1>
      <p class="lede">Ask for the sponsor pack, or send a general enquiry. We reply to every message.</p>
    </div>
  </section>

  <section class="section">
    <div class="contact">
      <button class="pack" id="pack" type="button">Request the sponsor pack<small>Packages, audience and what partners get back, in one document.</small></button>
      <form class="enquiry" id="enquiry">
        <h3 class="display" id="form-title">General enquiry</h3>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" required autocomplete="name">
        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>
        <button class="send" type="submit">Send</button>
      </form>
    </div>
  </section>

  <script>
    // Where enquiries go. Change this one line to the real address.
    var CONTACT_EMAIL = 'hello@545motorsport.co.uk';
    var subject = 'General enquiry';
    var pack = document.getElementById('pack');
    pack.addEventListener('click', function () {
      var on = pack.classList.toggle('on');
      subject = on ? 'Sponsor pack request' : 'General enquiry';
      document.getElementById('form-title').textContent = subject;
      var msg = document.getElementById('message');
      if (on && !msg.value) msg.value = 'Please send me the 545 Motorsport sponsor pack.';
      document.getElementById('email').focus();
    });
    document.getElementById('enquiry').addEventListener('submit', function (e) {
      e.preventDefault();
      var f = e.target;
      var body = 'Name: ' + f.name.value + '\nEmail: ' + f.email.value + '\n\n' + f.message.value;
      window.location.href = 'mailto:' + CONTACT_EMAIL + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
    });
  </script>
</main>
<footer class="site-foot">
  <div class="foot-contact">
    <h2 class="display">Contact</h2>
    <p>Questions, partnerships or prints, get in touch:</p>
    <a class="foot-email" href="mailto:hello@545motorsport.co.uk">hello@545motorsport.co.uk</a>
  </div>
  <div class="foot-base">
    <a href="index.html" aria-label="545 Motorsport home"><img src="logo/545-motorsport-navy.png" alt="545 Motorsport"></a>
    <p>&copy; 2026 545 Motorsport</p>
  </div>
</footer>
<script>
  (function () {
    var top = document.querySelector(".top");
    var solid = !document.querySelector(".hero");
    function set() { top.classList.toggle("solid", solid || window.scrollY > 40); }
    set(); window.addEventListener("scroll", set, { passive: true });
    var btn = document.querySelector(".nav-toggle");
    function close() { top.classList.remove("open"); btn.setAttribute("aria-expanded", "false"); }
    btn.addEventListener("click", function () {
      var open = top.classList.toggle("open");
      btn.setAttribute("aria-expanded", open ? "true" : "false");
    });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });
    document.addEventListener("click", function (e) { if (!top.contains(e.target)) close(); });
  })();
</script>
</body>
</html>
